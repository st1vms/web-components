<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Custom Cursor Example</title>

    <!-- Example Page Script -->
    <script defer type="module" src="example.js"></script>

    <!-- Example Page Style -->
    <style>
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        #enable-cursor {
            background-color: dodgerblue;
            color: white;
        }

        #disable-cursor {
            background-color: gray;
            color: black;
        }
    </style>

    <!-- Cursor Base Style -->
    <link rel="stylesheet" href="src/cursor.css">

    <!-- Example Cursor Style -->
    <style>
        .cursor {
            --cursor-width: 1rem;
            --cursor-height: 1rem;

            /* Customize cursor appeareance here */
            background: dodgerblue;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            /* ... */
        }
    </style>

</head>

<body>

    <!-- Include the custom cursor element -->
    <div id="custom-cursor" class="cursor"></div>

    <button id="enable-cursor">Enable Custom Cursor</button>
    <button id="disable-cursor" hidden>Disable Custom Cursor</button>

</body>

</html>
