<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        button {
            padding: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        .button-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            width: 100%;
            height: auto;
        }

        .enable-cursor {
            background-color: dodgerblue;
            color: white;
        }

        .disable-cursor {
            background-color: black;
            color: white;
        }

        .container {
            width: 50%;
            min-width: fit-content;
            height: 50%;
            padding: 1rem;
            background: black;
            position: relative;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container .disable-cursor {
            background-color: gray;
            color: black;
        }

        #cursor1 {
            --cursor-width: 1rem !important;
            --cursor-height: 1rem !important;
            background: dodgerblue;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #cursor2 {
            --cursor-width: 1rem !important;
            --cursor-height: 1rem !important;
            background: red;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            z-index: 2;
        }
    </style>
    <link rel="stylesheet" href="cursor.css">
    <script defer type="module" src="example.js"></script>

</head>

<body>

    <div id="cursor1" class="cursor"></div>

    <div class="button-container">
        <button id="enable1" class="enable-cursor">Enable Cursor 1</button>
        <button id="disable1" class="disable-cursor">Disable Cursor 1</button>
    </div>

    <div class="container">
        <div id="cursor2" class="cursor"></div>

        <div class="button-container">
            <button id="enable2" class="enable-cursor">Enable Cursor 2</button>
            <button id="disable2" class="disable-cursor">Disable Cursor 2</button>
        </div>
    </div>

</body>

</html>
